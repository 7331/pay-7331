# Arbitrum One (PLAN.md section 15; checked 2026-10-14).
#
# RPC, keyless, measured 2026-10-14 (limits not documented in the sources checked unless a URL is given):
# - arb1.arbitrum.io/rpc (Arbitrum's official endpoint, https://docs.arbitrum.io/build-decentralized-apps/reference/
#   node-providers): eth_getLogs over a range of 2,000,000 blocks back passes while a reply holds at most 10,000 logs
#   ("logs matched by query exceeds limit of 10000", -32000, which the watcher takes as a range refusal and halves);
#   not an archive for state (a balance 1,000,000 blocks back: "missing trie node"); batches of 50 blockNumber calls pass,
#   but a batch of 50 full blocks answered HTTP 429, which sets the endpoint aside for a while.
# - publicnode: eth_getLogs over at most about 100 blocks ("Archive requests require a personal token." past 128),
#   batches of 50 pass; the rest is pruned.
# - dRPC: eth_getLogs over at most 101 blocks (the same "ranges over 10000 blocks are not supported on free plan" as
#   on Polygon), batches of at most 3 (`JSON_RPC_BATCH_SIZE_BY_HOST`).
# The 100-block floor of the watcher's log range (`MINIMUM_LOG_RANGE_BLOCKS`) is what these two take; the first serves
# the tip-following order and a catch-up.
#
# Feeds: Chainlink's directory for Arbitrum One (https://reference-data-directory.vercel.app/
# feeds-ethereum-mainnet-arbitrum-1.json, 2026-10-14): ETH/USD 0x639F... heartbeat 1755 s deviation 0.05%, USDC/USD
# 0x5083... and USDT/USD 0x3f3f... heartbeat 255 s deviation 0.1%, EUR/USD 0xA14d... heartbeat 3600 s deviation 0.1%;
# all `feedCategory` "low", 8 decimals, `description()` matched on chain. Observed over the latest 1,500 rounds of each:
# the longest gap between updates was ETH/USD 1262 s, USDC/USD and USDT/USD 274 s, EUR/USD 3690 s (it updates on its
# hourly heartbeat through weekends too). Each limit below is the feed's heartbeat plus about five minutes for the age
# a price may have (Polygon's tolerance is five minutes over a 27 s heartbeat); the stale-feed alert is the heartbeat
# plus the minute's grace, EUR/USD's counted from 3660 s since its updates run up to 90 s late.
# ARB/USD, WBTC/USD, DAI/USD and BTC/USD feeds on Arbitrum all have an 86400 s heartbeat (the same directory), so by
# the asset rule (a fast heartbeat: one stale feed refuses every price of the chain) they are not listed.
#
# Fees: the base fee was 0.02 gwei and `eth_maxPriorityFeePerGas` answered 0 on all three endpoints; the sequencer orders
# first come, first served, so a tip buys nothing (https://docs.arbitrum.io/learn-more/faq). `maximum_fee_per_gas_gwei`
# 1 is 50 times that base fee: a refund (about 40,000 gas, its estimate including the L1 data fee as gas) costs at most
# 0.00004 ETH at the cap. `eth_estimateGas` of a plain transfer answered 24,296 gas (21,000 plus the L1 component), so a
# native transfer never gets the fixed 21,000 limit here (`gas_limit_of`).
#
# `finalized`: the batch carrying the block was posted to Ethereum and reached Ethereum's `finalized` block, "approximate
# hard-finality latency: time to post the batch, plus Ethereum finality" (https://docs.arbitrum.io/how-arbitrum-works/
# reference/finality-and-reorgs); the three endpoints agreed on it and it trailed `latest` by 1003 s (about 4,000 blocks)
# on 2026-10-14, hence 1020 s here. `safe` is not used (PLAN.md section 15).
# The L2 Sequencer Uptime Feed is Chainlink's address for Arbitrum One
# (https://docs.chain.link/data-feeds/l2-sequencer-feeds): answer 0 up, 1 down, `startedAt` 0 while uninitialized,
# one hour of grace after it is back.
[chains.arbitrum]
name = "Arbitrum One"
chain_id = 42161
rpc_urls = [
    "https://arb1.arbitrum.io/rpc",
    "https://arbitrum-one-rpc.publicnode.com",
    "https://arbitrum.drpc.org",
]
explorer_url = "https://arbiscan.io"
finality_tag = "finalized"
seconds_per_block = "0.25"
expected_finality_seconds = 1020
sequencer_uptime_feed = "0xFdB631F5EE196F0ed6FAa767959853A9F217697D"
poll_interval_seconds = 2
rescan_interval_seconds = 600
recent_deposit_window_seconds = 86400
old_deposit_rescan_interval_seconds = 86400
maximum_price_age_seconds = 3900
price_feed_heartbeat_seconds = 3660
minimum_priority_fee_gwei = "0"
fee_bump_after_seconds = 30
maximum_fee_per_gas_gwei = "1"
# Deployed 2026-10-14 by the refund key (nonce 0, so the same address as on Polygon), block 0x1eaecd76.
factory_address = "0x91749BD4e0Db4050D4F0B07f0E8f929Da552a661"
price_rpc_urls = []
price_chain_id = 42161
eur_usd_feed = "0xA14d53bC1F1c0F31B4aA3BD109344E5009051a84"
assets = [
    # 0.05 USD is about 0.00002 ETH at the ETH/USD price of 2026-10-14 (about 2,417 USD); quotes round up to 6 places.
    { symbol = "ETH", name = "Ether", decimals = 18, quote_decimals = 6, token_address = "", usd_feed = "0x639Fe6ab55C921f74e7fac1ee960C0B6293ba612", price_feed_heartbeat_seconds = 1755, maximum_price_age_seconds = 2100, minimum_sweep_amount = "0.00002" },
