# Empty until the owner makes the treasury Safe (`treasury create-safe`) and sets it up.
treasury_safe_address = ""
allowance_module_address = "0xAA46724893dedD72658219405185Fb0Fc91e091C"
safe_singleton_address = "0x29fcB43b46531BcA003ddC8FCB67FFE91900C762"
safe_proxy_factory_address = "0x4e1DCf7AD4e460CfD30791CCC4F9c8a4f820ec67"
