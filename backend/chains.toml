safe_multi_send_call_only_address = "0x9641d764fc13c8B624c04430C7356C1C7C8102e2"
# A sweep costs about 0.03 to 0.06 POL at 2026-10-09 fees, a POL refund 0.005: 1 POL is tens of sweeps. The refund
# key's float must hold at least one minimum refund (`PAY_MINIMUM_REFUND_USD`, 1 USD) in each coin, or such a refund
# waits for float for ever: 2 POL (about 0.20 USD) never could (2026-10-14). Sized for a small treasury:
# the refund key keeps about 2.5 USD of POL (25) and 10 of each stablecoin, and
# never less than its low mark between top-ups, so the low marks (20 POL, 8 of each) are what must cover a minimum
# refund, with room for POL's price to halve.
# `treasury_low` fires below one day of every active key's allowance, about 34 POL, 10 USDC and 10 USDT with two
# sweepers. Raise them with volume.
top_ups = [
    { role = "sweeper", asset_symbol = "POL", low_amount = "0.5", target_amount = "1", daily_allowance_amount = "2" },
    { role = "refund", asset_symbol = "POL", low_amount = "20", target_amount = "25", daily_allowance_amount = "30" },
    { role = "refund", asset_symbol = "USDC", low_amount = "8", target_amount = "10", daily_allowance_amount = "10" },
    { role = "refund", asset_symbol = "USDT", low_amount = "8", target_amount = "10", daily_allowance_amount = "10" },
]

