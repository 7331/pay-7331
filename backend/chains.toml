# Public chain facts (PLAN.md sections 1 and 14; checked 2026-10-09, assets 2026-10-11). `PAY_ENABLED_CHAINS` picks which run. Per deployment,
# `PAY_RPC_URLS_<CHAIN>` (comma separated), `PAY_PRICE_RPC_URLS_<CHAIN>` and `PAY_FACTORY_ADDRESS_<CHAIN>` override
# `rpc_urls`, `price_rpc_urls` and `factory_address`; nothing else here is environment-specific.
#
# Per chain: `chain_id` (startup refuses an RPC serving another), `rpc_urls` in failover order, `explorer_url`,
# `finality_tag` (only `finalized` is supported), `poll_interval_seconds` (watcher tick), `rescan_interval_seconds`
# (every recent deposit, all assets: one whose invoice is younger than `recent_deposit_window_seconds` or not closed
# yet), `old_deposit_rescan_interval_seconds` (every other deposit ever made, all assets), the static deposit scan's
# `static_deposit_hot_scan_interval_seconds`, `static_deposit_hot_window_seconds` and
# `static_deposit_cold_scan_interval_seconds` (optional: 60, 86400 and 1200; PLAN.md section 17),
# `maximum_price_age_seconds` (no price is used from an older feed answer: quotes, credits, refunds, estimates),
# `minimum_priority_fee_gwei`, `fee_bump_after_seconds` (an unmined attempt is replaced at the same nonce),
# `maximum_fee_per_gas_gwei` (the fee cap no attempt or bump goes above; both fees are decimal strings in gwei, since
# a rollup's fees are fractions of one), `seconds_per_block` (a decimal string: every block-count threshold of the
# watcher is written in seconds and turned into blocks with it, PLAN.md section 15), `expected_finality_seconds` (how
# long `finalized` usually trails a payment: the payer's confirming screen says it, and the stuck-operation alert
# waits that long longer; money moves on the `finalized` tag, never on this number), `sequencer_uptime_feed` (a
# rollup's Chainlink L2 Sequencer Uptime Feed: no price is used while it answers 1 (down) or for an hour after it was
# back; empty where there is none), `price_feed_heartbeat_seconds` (the feeds'
# heartbeat: reconcile and the operator alerts flag a feed older than it plus a minute),
# `factory_address` (empty until deployed), `price_rpc_urls` (empty: the chain's own; Amoy reads mainnet feeds) and
# `price_chain_id` (the chain those endpoints must serve),
# `eur_usd_feed`, and `assets` (symbol, name, decimals, `quote_decimals` (places a quote is rounded up to, so the
# amount stays short to type), `token_address` empty for the native coin, `usd_feed`, `usd_peg` (true for a USD stablecoin: priced at 1 USD near
# its peg, never above 1 USD off it), `minimum_sweep_amount`
# (about 0.05 USD: no invoice for less, no repeat sweep of a swept deposit for less, so dust cannot make the
# operator pay gas)).
#
# Per chain, `kind` (2026-10-14): `"evm"` (the default, everything above) or `"monero"` (PLAN.md section 14). A Monero
# chain has none of the EVM-only fields (`chain_id`, `rpc_urls`, `finality_tag`, the rescan and fee fields,
# `factory_address`, the treasury table) and the loader refuses them there, as it refuses these on an EVM chain.
# It has `name`, `explorer_url`, `poll_interval_seconds` (the scanner's poll), `network` ("mainnet" or "stagenet"),
# `nodes = [{ url, operator }]` (restricted-RPC nodes in failover order, at least 2 operators: count operators, not
# hosts; per deployment `PAY_MONERO_NODES_<CHAIN>`, comma-separated `url=operator` pairs with the operator named
# explicitly, overrides it; mainnet takes https URLs only, stagenet http too), `confirmations_final` (where money moves: mainnet 10, the consensus spend lock;
# stagenet 2 for the end-to-end run), the price fields (`maximum_price_age_seconds`, `price_feed_heartbeat_seconds`,
# `price_rpc_urls`, `price_chain_id`, `price_chain_key`, `eur_usd_feed`) and the one asset XMR (12 decimals, `token_address` empty,
# `usd_feed` Chainlink XMR/USD on Polygon, read over `price_rpc_urls` as Amoy reads mainnet feeds, with its own
# `price_feed_heartbeat_seconds` and `maximum_price_age_seconds` (an asset may set both; left out, it takes the
# chain's), `minimum_sweep_amount` "0": nothing is swept on this kind, so the 1 USD invoice minimum guards it instead,
# for an XMR-priced amount too, valued at the live XMR/USD price when the invoice is made).
#
# Per chain, `[chains.<key>.treasury]` (PLAN.md section 5, treasury; 2026-10-13): `treasury_safe_address` (the Safe
# that funds the operator keys; empty turns the treasury off: no top-ups and no treasury returns; per deployment
# `PAY_TREASURY_SAFE_ADDRESS_<CHAIN>` overrides it), `allowance_module_address` (Safe's Allowance Module v0.1.1; empty
# where it is not deployed, and then no treasury can be set), the Safe v1.4.1 deployment the treasury CLI builds on
# (`safe_singleton_address` SafeL2, `safe_proxy_factory_address`, `safe_fallback_handler_address`
# CompatibilityFallbackHandler, `safe_multi_send_call_only_address`), and `top_ups`: per key role (`refund`: the
# refund key, float and refund gas; `sweeper`: each sweeper key, gas only) and `asset_symbol`, `low_amount` (below it
# the watcher pulls a top-up), `target_amount` (what a top-up fills up to) and `daily_allowance_amount` (the
# allowance `treasury setup-transactions` sets per key, reset every 1440 minutes), all decimal strings in token units.
# Addresses: Safe v1.4.1 canonical (https://github.com/safe-global/safe-deployments, src/assets/v1.4.1, "137":
# "canonical"); the Allowance Module from
# https://github.com/safe-global/safe-modules-deployments src/assets/allowance-module/v0.1.1/allowance-module.json
# (137 only; Amoy has none). Each has code on Polygon (checked 2026-10-13).
#
# Assets are a curated list, display order, each priced by a live Chainlink USD feed. Checked
# 2026-10-11: token addresses and decimals against CoinGecko's token list (tokens.coingecko.com/polygon-pos/all.json)
# and on-chain `symbol()`/`decimals()`; each token moved exactly the amount sent on a fork transfer (no
# fee-on-transfer) and held its balance over 100 blocks (no rebasing). Feeds from Chainlink's directory, the list
# docs.chain.link's Polygon feed page loads (https://reference-data-directory.vercel.app/feeds-matic-mainnet.json,
# checked 2026-10-13): each is a `feedCategory` "low" (low market risk) feed with a 27 s heartbeat and 8 decimals, and
# its `description()` matched on 2026-10-11. `quote_decimals`: one step under a cent at 2026-10-11 prices
# (stablecoins 2).

[chains.polygon]
name = "Polygon"
chain_id = 137
# Keyless eth_getLogs, measured 2026-10-12 (PLAN.md section 1 has the table). The watcher halves a range an endpoint
# refuses down to 100 blocks and fails over on a history refusal, so the first two keep the tip-following order of
# 2026-10-09 and the last three serve a catch-up:
# - publicnode: logs at least 100,000 blocks back (2026-10-14; it was 98 blocks earlier), 5M back is "Archive requests
#   require a personal token" (HTTP 403); ranges over 10,000 blocks get -32701 "exceed maximum block range: 10000".
#   Limits not documented in the sources checked (https://polygon.publicnode.com).
# - dRPC: full history, but its free plan refuses ranges over 101 blocks, at the tip and 5M blocks back alike ("ranges
#   over 10000 blocks are not supported on free plan", HTTP 400, whatever the range); at most 10,000 logs and a 2 s
#   timeout a request, 120,000 compute units a minute per IP, batches of at most 3 requests
#   (https://drpc.org/docs/howitworks/ratelimiting; the client sends 3, `JSON_RPC_BATCH_SIZE_BY_HOST`). Near the tip
#   it clamped a `toBlock` past its head and answered logs instead of refusing (2026-10-13).
# - Tenderly (Polygon's community endpoint): full history, ranges up to 10,000 blocks (HTTP 413 above); "no rate limits
#   for basic usage" (https://tenderly.co/blog/changelog/tenderly-is-a-polygon-public-rpc-provider); Tenderly's docs
#   say 3,000 logs a reply on public endpoints (https://docs.tenderly.co/node-rpc/overview), measured 5,912 passing.
# - QuickNode's public endpoint (listed at https://docs.polygon.technology/pos/reference/rpc-endpoints/): full history,
#   "eth_getLogs is limited to a 10,000 range" (HTTP 413), slow on wide ranges (10,000 blocks in 3.7 s); 20 requests a
#   second, batch entries included (-32007 "20/second request limit reached" for 30 of a batch of 50, 2026-10-13; the
#   client sends 10, and sets the endpoint aside on a -32007, PLAN.md section 1). Its public endpoint's limits are not
#   documented in the sources checked (https://www.quicknode.com/docs/ethereum/error-references lists the codes).
# - Pocket's public portal: full history, 100,000 blocks passed; 2,000 requests a minute per IP
#   (https://docs.pocket.network/developers/supported-chains/); once answered "historical state is not available"
#   (a pruned supplier), which fails over, and 3 of 40 deep 2,000-block reads "relay timeout exceeded" (HTTP 504),
#   which narrows the range.
# Refused or dead on 2026-10-12: polygon-rpc.com, Nodies, Ankr, OnFinality, rpcfast (key or plan), 1rpc.io (503),
# BlockPI and Omnia (521), Blast (shut down), Lava (discontinued), LlamaRPC and meowrpc (no DNS), ZAN (no getLogs
# without an account), Tatum (ranges over 100 blocks refused, and in one run a null result instead of logs for
# 10,000), polygon.gateway.tenderly.co (Tenderly again; 12 of 60 requests sent 10 at a time rate limited).
# rpc.sentio.xyz/matic answered keyless (10,000 blocks, full history) but no source checked offers it as a public
# endpoint, so it is left out.
rpc_urls = [
    "https://polygon-bor-rpc.publicnode.com",
    "https://polygon.drpc.org",
    "https://tenderly.rpc.polygon.community",
    "https://rpc-mainnet.matic.quiknode.pro",
    "https://poly.api.pocket.network",
]
explorer_url = "https://polygonscan.com"
finality_tag = "finalized"
# Polygon's blocks take about 2 s; `finalized` trails by 2 to 5 s (Heimdall v2 fast finality,
# https://docs.polygon.technology/pos/concepts/finality/finality).
seconds_per_block = "2"
expected_finality_seconds = 5
sequencer_uptime_feed = ""
poll_interval_seconds = 2
rescan_interval_seconds = 600
recent_deposit_window_seconds = 86400
old_deposit_rescan_interval_seconds = 86400
# Polygon's feeds answered 5 to 26 seconds old on 2026-10-09; five minutes old means a stalled feed (it
# was an hour before 2026-10-13). Over 2026-10-06 to 10-13 no listed feed went more than 69 s between updates. EUR/USD follows forex
# hours (https://docs.chain.link/data-feeds/selecting-data-feeds, "Market hours") but kept updating through the weekend
# of 2026-10-10/11 at the Friday close (at most 47 s apart), so it did not trip this; holidays not seen yet.
maximum_price_age_seconds = 300
# Every feed above has a 27 s heartbeat (Chainlink's directory, checked 2026-10-12); reconcile and the operator alerts
# flag one past it plus a minute, long before quotes refuse it.
price_feed_heartbeat_seconds = 27
# Polygon's documented minimum tip (https://docs.polygon.technology/tools/gas/polygon-gas-station.md).
minimum_priority_fee_gwei = 25
fee_bump_after_seconds = 30
# About 8x the 249 gwei base fee of 2026-10-09: a refund (21,000 gas) costs at most 0.042 POL; a stuck attempt waits
# for the base fee to come down instead of bidding without end.
maximum_fee_per_gas_gwei = 2000
factory_address = "0x91749BD4e0Db4050D4F0B07f0E8f929Da552a661"  # deployed 2026-10-09, block 95206166
price_rpc_urls = []
price_chain_id = 137
eur_usd_feed = "0x73366Fe0AA0Ded304479862808e02506FE556a98"
assets = [
    { symbol = "POL", name = "Polygon Ecosystem Token", decimals = 18, quote_decimals = 4, token_address = "", usd_feed = "0xAB594600376Ec9fD91F8e885dADF0CE036862dE0", minimum_sweep_amount = "0.5" },
    { symbol = "USDC", name = "USD Coin", decimals = 6, quote_decimals = 2, token_address = "0x3c499c542cEF5E3811e1192ce70d8cC03d5c3359", usd_feed = "0xfE4A8cc5b5B2366C1B58Bea3858e81843581b2F7", usd_peg = true, minimum_sweep_amount = "0.05" },
    # On-chain name() is "USDT0" (checked 2026-10-09), which payers read as a typo: shown as "Tether USD" (2026-10-11); the
    # API symbol stays USDT (PLAN.md section 7). `name` is display only.
    { symbol = "USDT", name = "Tether USD", decimals = 6, quote_decimals = 2, token_address = "0xc2132D05D31c914a87C6611C10748AEb04B58e8F", usd_feed = "0x0A6513e40db6EB1b165753AD52E80663aeA50545", usd_peg = true, minimum_sweep_amount = "0.05" },
    # Bridged USDC; on-chain symbol() is "USDC" (checked 2026-10-11), so the API symbol is USDC.e. The USDC/USD feed.
    { symbol = "USDC.e", name = "USD Coin (PoS)", decimals = 6, quote_decimals = 2, token_address = "0x2791Bca1f2de4661ED88A30C99A7a9449Aa84174", usd_feed = "0xfE4A8cc5b5B2366C1B58Bea3858e81843581b2F7", usd_peg = true, minimum_sweep_amount = "0.05" },
    { symbol = "WETH", name = "Wrapped Ether", decimals = 18, quote_decimals = 6, token_address = "0x7ceB23fD6bC0adD59E62ac25578270cFf1b9f619", usd_feed = "0xF9680D99D6C9589e2a93a78A04A279e509205945", minimum_sweep_amount = "0.00002" },
    # BTC/USD, not WBTC/USD (0xDE31F8bFBD8c84b5360CFACCa3539B938dd78ae6): that one is low-risk now but has a 300 s
    # heartbeat (Chainlink's directory, 2026-10-13), and reconcile and the operator alerts flag any feed older than the
    # chain-wide `price_feed_heartbeat_seconds` (27) plus a minute, so it would alert whenever it sits between updates.
    # A WBTC depeg from BTC is not priced in.
    { symbol = "WBTC", name = "Wrapped BTC", decimals = 8, quote_decimals = 7, token_address = "0x1BFD67037B42Cf73acF2047067bd4F2C47D9BfD6", usd_feed = "0xc907E116054Ad103354f2D350FD2514433D57F6f", minimum_sweep_amount = "0.0000006" },
    { symbol = "DAI", name = "Dai Stablecoin", decimals = 18, quote_decimals = 2, token_address = "0x8f3Cf7ad23Cd3CaDbD9735AFf958023239c6A063", usd_feed = "0x4746DeC9e833A82EC7C2C1356372CcF2cfcD2F3D", usd_peg = true, minimum_sweep_amount = "0.05" },
    # The PoS-bridged ERC-20 LINK. Chainlink's own ERC-677 LINK on Polygon (0xb0897686c545045aFc77CF20eC7A532E3120E0F1,
    # https://docs.chain.link/resources/link-token-contracts; PegSwap converts between them) is another token: sent to a
    # deposit it is not watched at all: neither a payment nor stray money, and no rescan or check reads it.
    { symbol = "LINK", name = "Chainlink", decimals = 18, quote_decimals = 4, token_address = "0x53E0bca35eC356BD5ddDFebbD1Fc0fD03FaBad39", usd_feed = "0xd9FFdb71EbE7496cC440152d43986Aae0AB76665", minimum_sweep_amount = "0.004" },
    { symbol = "AAVE", name = "Aave", decimals = 18, quote_decimals = 5, token_address = "0xD6DF932A45C0f255f85145f286eA0b292B21C90B", usd_feed = "0x72484B12719E23115761D5DA1646945632979bB6", minimum_sweep_amount = "0.0003" },
    { symbol = "UNI", name = "Uniswap", decimals = 18, quote_decimals = 4, token_address = "0xb33EaAd8d922B1083446DC23f610c2567fB5180f", usd_feed = "0xdf0Fb4e4F928d2dCB76f438575fDD8682386e13C", minimum_sweep_amount = "0.006" },
]

